---
- name: Reload systemd and restart the tty1 getty
  # daemon_reload picks up the removed auto-login drop-ins; restarting getty@tty1
  # makes the login prompt appear on the running console without a reboot. The
  # serial getty picks up its removal on the next boot.
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: getty@tty1.service
    state: restarted

- name: Reboot into the standard kernel
  # Only reached when the console-kernel block actually installed a new kernel;
  # the running cloud kernel keeps the display dead until this reboot happens.
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: "'cloud' in ansible_kernel"
