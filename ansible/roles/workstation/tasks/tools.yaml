---
# Kali function groups from lab.conf, WITHOUT the kali-tools- prefix, which
# this file prepends -- that is what makes the kali-linux-* umbrellas
# unreachable, since all four pull openvpn and vpnc and no kali-tools-* does.
# Everything downloads over the tunnel, never the real IP.
#
# Ordering is load-bearing: existence check, install, then a purge that is
# simulated first, or the purge takes the requested tools with it.

- name: Fail clearly if tool groups are selected without egress
  ansible.builtin.fail:
    msg: >-
      KALI_TOOL_GROUPS selects tool groups but this host cannot reach a package
      mirror. It has no NAT NIC by design; the gateway must forward its traffic
      through the tunnel first (Phase 2). Clear KALI_TOOL_GROUPS, or finish
      Phase 2.
  when:
    - (workstation_tools_groups | default([])) | length > 0
    - not workstation_has_egress | default(false) | bool

- name: Refresh the apt cache before checking whether the groups exist
  # apt-cache policy below never fetches: on a stale cache a perfectly valid
  # group reads back with no Candidate line and the next task would diagnose a
  # transport problem as a typo.
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when:
    - (workstation_tools_groups | default([])) | length > 0
    - workstation_has_egress | default(false) | bool

- name: Ask the archive about every selected tool group
  ansible.builtin.command:
    cmd: "apt-cache policy kali-tools-{{ item }}"
  register: anon_tool_group_policy
  changed_when: false
  loop: "{{ workstation_tools_groups | default([]) }}"
  when: workstation_has_egress | default(false) | bool

- name: Fail on a tool group Kali does not have
  # apt-cache policy exits 0 for a package it has never heard of and prints
  # nothing, so the exit status is not the signal -- a real group has a
  # "Candidate:" line. Without this a typo installs nothing and the build is
  # green with no tools.
  #
  # Mutation: delete this task and an invalid group fails later inside the
  # install task with a raw apt error instead.
  ansible.builtin.fail:
    msg: >-
      kali-tools-{{ item.item }} does not exist in Kali's archive. Fix
      KALI_TOOL_GROUPS in lab.conf; group names are the part after
      "kali-tools-", for example web, passwords, top10.
  loop: "{{ anon_tool_group_policy.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not (item.skipped | default(false))
    - "('Candidate:' not in item.stdout) or ('Candidate: (none)' in item.stdout)"

- name: Install the selected Kali tool groups
  # Recommends stay ON, as for the desktop: a Kali metapackage without them is
  # a subtly incomplete tool set. 2 to 650 packages per group, every byte
  # through the multihop tunnel.
  ansible.builtin.apt:
    name: "{{ (workstation_tools_groups | default([])) | map('regex_replace', '^(.*)$', 'kali-tools-\\1') | list }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - (workstation_tools_groups | default([])) | length > 0
    - workstation_has_egress | default(false) | bool

# --- The purge, simulated before it runs -------------------------------------
# A no-op on a Kali where no tool group pulls a VPN package; this is the net
# for the day that stops being true. It runs unconditionally rather than only
# after an install, so a package that arrives any other way is caught on the
# next `make configure`.

- name: List what is actually installed on the workstation
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      dpkg-query -W -f='${Package} ${db:Status-Status}\n' \
        | awk '$2 != "not-installed" && $2 != "config-files" { print $1 }'
  args:
    executable: /bin/bash
  register: anon_ws_installed
  changed_when: false

- name: Name the VPN packages that are present
  ansible.builtin.set_fact:
    anon_vpn_present: "{{ workstation_vpn_watch_list | intersect(anon_ws_installed.stdout_lines) }}"

- name: Simulate the purge, to see what would go with them  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: "apt-get -s purge {{ anon_vpn_present | join(' ') }}"
  register: anon_purge_sim
  changed_when: false
  when: anon_vpn_present | length > 0

- name: Name what the purge simulation reports removing
  # Defined ONCE as a fact so both guards below read the identical value.
  #
  # Both "Purg " and "Remv " count as collateral: apt reports a dependency
  # cascade of directly named packages as "Purg", so a regex matching only
  # "Remv " sees zero collateral on exactly the case this guard exists for.
  #
  # Two plain substitutions, not one regex_replace with a backreference: in a
  # folded block scalar a \1 comes out as the literal characters, so the guard
  # would fire with a message naming nothing.
  ansible.builtin.set_fact:
    anon_would_remove: >-
      {{ anon_purge_sim.stdout_lines | default([])
         | select('match', '^(Remv|Purg) ')
         | map('regex_replace', '^(Remv|Purg) ', '')
         | map('regex_replace', ' .*$', '') | list }}

- name: Refuse to act on a purge simulation that could not be read
  # anon_would_remove comes purely from a regex over apt's output. If that
  # parse yields nothing for a package that WAS named on the command line, the
  # collateral check below sees an artificially small set, its `when:` goes
  # false, and the real purge runs unopposed -- a guard reading its own absence
  # as "nothing to worry about". Every member of anon_vpn_present must appear,
  # because apt always echoes back what it was asked to purge.
  #
  # Mutation: break the regex above to '^NEVERMATCH ' and the play stops here,
  # on this message, with the purge never reached.
  ansible.builtin.fail:
    msg: >-
      apt-get -s purge {{ anon_vpn_present | join(' ') }} did not report removing
      {{ anon_vpn_present | difference(anon_would_remove) | join(' ') }}; its output could
      not be parsed, so the collateral check below proves nothing.
  when:
    - anon_vpn_present | length > 0
    - (anon_vpn_present | difference(anon_would_remove)) | length > 0

- name: Refuse a purge that would take the requested tools with it
  # What the purge removes must be a SUBSET of the watch list: collateral means
  # a tool group pulled a VPN client in as a hard dependency, so purging takes
  # the requested tools with it. Neither outcome is acceptable unasked.
  #
  # Mutation: watch-list a library with dependents (libosip2-15t64, via
  # kali-tools-detect) and the play stops here naming it, nothing purged.
  vars:
    collateral: "{{ anon_would_remove | difference(workstation_vpn_watch_list) }}"
  ansible.builtin.fail:
    msg: >-
      Purging {{ anon_vpn_present | join(' ') }} would also remove
      {{ collateral | join(' ') }}. A tool group has pulled a VPN client in as a
      hard dependency. Drop that group from KALI_TOOL_GROUPS, or accept a
      workstation that holds a VPN client, which `make verify` will fail on.
  when:
    - anon_vpn_present | length > 0
    - collateral | length > 0

- name: Purge the VPN client packages
  # Idempotent by construction: after the first run anon_vpn_present is empty,
  # so this and the two guards above are skipped.
  ansible.builtin.apt:
    name: "{{ anon_vpn_present }}"
    state: absent
    purge: true
  when: anon_vpn_present | length > 0
