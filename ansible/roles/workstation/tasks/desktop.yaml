---
# The Kali XFCE desktop and Mullvad Browser.
#
# ORDER IN THIS FILE IS LOAD-BEARING, and the rule is one rule: every drop-in
# that overrides a packaged default is written BEFORE the package that ships
# it. kali-desktop-xfce hard-depends on network-manager-gnome, so installing
# first leaves a window in which NetworkManager claims this host's only NIC and
# rewrites /etc/resolv.conf; lightdm's postinst enables and starts the display
# manager during the install, so a drop-in written afterwards leaves the
# packaged default in force for the length of it.

- name: Fail clearly if the desktop is enabled without egress
  ansible.builtin.fail:
    msg: >-
      workstation_desktop is enabled but this host cannot reach a package mirror.
      It has no NAT NIC by design; the gateway must forward its traffic through
      the tunnel first. Set workstation_has_egress, or turn the desktop back off.
  when:
    - workstation_desktop | default(false) | bool
    - not workstation_has_egress | default(false) | bool

- name: Fail clearly if the desktop is enabled without a console password
  # A greeter on an account cloud-init locked cannot be logged into at all.
  # Better to say so now than after installing ~950 packages over a VPN.
  ansible.builtin.fail:
    msg: >-
      workstation_desktop is enabled but workstation_console_password is empty.
      cloud-init locks the account, so lightdm would present a greeter no password
      can pass. Put a value on the WORKSTATION_CONSOLE_PASSWORD line of your
      existing .env, then re-run. (`make preflight` will NOT do this for you: it
      only generates passwords when .env does not exist yet.) Or turn the
      desktop back off.
  when:
    - workstation_desktop | default(false) | bool
    - (workstation_console_password | default('')) | length == 0

- name: Find the workstation's NIC (the one holding its segment address)
  # Kept as a LIST and asserted below rather than narrowed with `| first`: a
  # config that marks the WRONG device unmanaged reads perfectly and protects
  # nothing.
  ansible.builtin.set_fact:
    anon_ws_if_candidates: >-
      {{ ansible_facts.interfaces
         | map('regex_replace', '^', '')
         | select('ne', 'lo')
         | map('extract', ansible_facts)
         | selectattr('ipv4', 'defined')
         | selectattr('ipv4.address', 'equalto', internal_ip)
         | map(attribute='device') | list }}

- name: Fail if the workstation's NIC could not be identified unambiguously
  ansible.builtin.assert:
    that:
      - anon_ws_if_candidates | length == 1
    fail_msg: >-
      Expected EXACTLY ONE interface holding {{ internal_ip }}, found
      {{ anon_ws_if_candidates }}. Refusing to write a NetworkManager exclusion
      that might name the wrong device.

- name: Name the workstation's NIC
  ansible.builtin.set_fact:
    anon_ws_if: "{{ anon_ws_if_candidates | first }}"

- name: Ensure the NetworkManager config directory exists
  # Created before the package, so the drop-in is in place the first time
  # NetworkManager ever starts.
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove the old 00-prefixed NetworkManager drop-in, if present
  # An earlier version of this role wrote 00-anon-egress-unmanaged.conf, which
  # sorted FIRST and was therefore the weakest file in the directory. Ansible
  # will not remove it on its own, and two files with the same keys and
  # conflicting authority is worse than either alone.
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d/00-anon-egress-unmanaged.conf
    state: absent

- name: Take NetworkManager's hands off the network
  # The desktop hard-depends on NetworkManager, so it WILL be installed; with
  # no managed device and no DNS control it can do no harm. dns=none keeps it
  # off resolv.conf, and connectivity.enabled=false stops Debian's probe to
  # network-test.debian.org -- not an IP leak, but a recurring beacon on the
  # one host whose job is to be indistinguishable.
  #
  # 99-, NOT 00-: conf.d is read alphabetically and the LAST file wins, so a
  # 00- prefix would let any later drop-in hand back the NIC and resolv.conf.
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/99-anon-egress-unmanaged.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role: workstation).
      [main]
      dns=none

      [keyfile]
      unmanaged-devices=interface-name:{{ anon_ws_if }}

      [connectivity]
      enabled=false

- name: Ensure the lightdm config directory exists
  ansible.builtin.file:
    path: /etc/lightdm/lightdm.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Never auto-log in to the desktop
  # An unauthenticated session on an anonymity workstation is not acceptable,
  # and a desktop that logs itself in hands a full session to anyone who opens
  # the UTM window. Asserted rather than trusting Kali's packaged default,
  # which is theirs to change. 99- sorts last, so it overrides lightdm.conf.
  ansible.builtin.copy:
    dest: /etc/lightdm/lightdm.conf.d/99-anon-egress-no-autologin.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role: workstation).
      [Seat:*]
      autologin-user=
      autologin-user-timeout=0

- name: Install the Kali XFCE desktop
  # WITH recommends (~950 packages vs 537): without them the desktop is subtly
  # broken. They also pull the NetworkManager VPN plugins tools.yaml purges.
  # The longest operation in the repo, every byte through the tunnel, with no
  # output for minutes. No cache_valid_time: a failed update still refreshes
  # the timestamp and the next hour of retries would report a useless error.
  ansible.builtin.apt:
    name: kali-desktop-xfce
    state: present
    install_recommends: true
    update_cache: true

# The VPN purge deliberately lives in tools.yaml, not here: main.yaml includes
# this file first, so a purge here would run before tools.yaml's simulate-first
# guard had a chance to check whether it would take a requested tool group down
# with it. That guard runs unconditionally, so it already covers this list.

- name: Install or remove the SPICE guest agent (host clipboard sharing)
  # BEFORE lightdm starts: the per-session half autostarts with the session, so
  # a package that lands later leaves the clipboard dead until the next login.
  # Removed rather than skipped when off, so flipping the flag really closes it.
  ansible.builtin.apt:
    name: spice-vdagent
    state: "{{ 'present' if (workstation_clipboard | default(false) | bool) else 'absent' }}"
    purge: true
  notify: Restart the display manager

- name: Enable the SPICE agent daemon
  ansible.builtin.systemd_service:
    name: spice-vdagentd
    enabled: true
    state: started
  when: workstation_clipboard | default(false) | bool

- name: Read the current default systemd target
  ansible.builtin.command: systemctl get-default
  register: anon_default_target
  changed_when: false

- name: Boot into the graphical target
  # `systemctl set-default` always reports success, so the read above gates it
  # and keeps `make configure` at changed=0.
  ansible.builtin.command: systemctl set-default graphical.target
  changed_when: true
  when: anon_default_target.stdout | trim != 'graphical.target'

- name: Start the display manager
  # set-default only decides the NEXT boot, and installing lightdm does not
  # launch it (systemd reached its target before the package existed). Without
  # this the role finishes with a fully installed desktop and no greeter.
  ansible.builtin.systemd_service:
    name: lightdm
    enabled: true
    state: started

- name: Install Mullvad's repository signing key
  # ASCII-armoured under /usr/share/keyrings and referenced by `signed-by=`
  # below. NEVER apt-key: it trusts the key for EVERY repository on the host.
  #
  # Deliberately no `checksum:` -- Mullvad re-armouring the same key would
  # change the digest without changing who is trusted. The two tasks below
  # assert the thing that matters instead.
  ansible.builtin.get_url:
    url: https://repository.mullvad.net/deb/mullvad-keyring.asc
    dest: /usr/share/keyrings/mullvad-keyring.asc
    owner: root
    group: root
    mode: "0644"

- name: Read the fingerprints in Mullvad's keyring
  ansible.builtin.command:
    cmd: gpg --show-keys --with-colons /usr/share/keyrings/mullvad-keyring.asc
  register: anon_mullvad_keyring
  changed_when: false

- name: Fail if Mullvad's signing key is not the one this role decided to trust
  # PRESENCE, not an exact key list: the keyring legitimately carries several
  # keys and Mullvad may add another. The one below disappearing or being
  # replaced is a repository takeover until proven otherwise. Matched between
  # colons, so it must be a whole field of gpg's record.
  ansible.builtin.assert:
    that:
      - "':' ~ anon_mullvad_key_fpr ~ ':' in anon_mullvad_keyring.stdout"
    fail_msg: >-
      /usr/share/keyrings/mullvad-keyring.asc does NOT contain
      {{ anon_mullvad_key_fpr }}, the key this role trusts to sign Mullvad
      Browser. Do not "fix" this by updating the constant. Fetch the key
      yourself, compare its fingerprint against the one Mullvad publishes at
      https://mullvad.net/en/help/verifying-installer-signatures, and only once
      the new key checks out replace anon_mullvad_key_fpr in this file. Until
      then, treat the repository as compromised.
    success_msg: "Mullvad's keyring still contains {{ anon_mullvad_key_fpr }}"
  vars:
    # rsa4096, uid "Mullvad (code signing) <admin@mullvad.net>".
    anon_mullvad_key_fpr: A1198702FC3E0A09A9AE5B75D5A1D4F266DE8DDF

- name: Refuse to install any Mullvad VPN client here
  # Written BEFORE the repository is added, so there is never a moment in which
  # mullvad-vpn is installable. Mullvad's arm64 repository carries it alongside
  # the browser, and this host must never hold VPN credentials.
  #
  # `Package:` is glob-matched, so mullvad-vpn* also covers a renamed or beta
  # successor. `Pin: origin *` is measured working on this guest; the last task
  # in this file fails the build loudly if that ever stops being true.
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/99-anon-egress-no-vpn-client
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role: workstation).
      # The workstation never runs a VPN client: the gateway is the anonymity
      # layer, and credentials live only there.
      Package: mullvad-vpn*
      Pin: origin *
      Pin-Priority: -1

- name: Add Mullvad's apt repository
  # arch=arm64 keeps apt from asking this repo about foreign architectures;
  # signed-by scopes the key to this repository alone.
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/mullvad.list
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role: workstation).
      deb [arch=arm64 signed-by=/usr/share/keyrings/mullvad-keyring.asc] https://repository.mullvad.net/deb/stable stable main

- name: Install Mullvad Browser
  # The ALPHA package, and not by preference: Mullvad publishes stable
  # mullvad-browser for amd64 only, and their arm64 archive lists exactly
  # mullvad-browser-alpha and mullvad-vpn. Worth it: the browser fingerprint is
  # what the tunnel cannot hide, and a hand-hardened Firefox would be MORE
  # identifiable, not less.
  ansible.builtin.apt:
    name: mullvad-browser-alpha
    state: present
    update_cache: true

- name: Assert apt really does refuse the Mullvad VPN client
  # Runs last, once the repository is added and the cache refreshed: a pin can
  # only be tested against a repository apt has actually read.
  #
  # verify.sh asserts only that mullvad-vpn is ABSENT, which is equally true on
  # a host where the pin is dead and nobody happened to type `apt install`.
  # This is the behavioural half. TWO conditions, both needed: "nothing offers
  # it at a usable priority" is vacuously true when apt cannot see the package
  # at all, so it must first be VISIBLE in the version table.
  ansible.builtin.shell: |
    set -euo pipefail
    policy="$(apt-cache policy mullvad-vpn)"
    printf '%s\n' "$policy" | grep -q 'Version table:' || {
      echo "apt cannot see mullvad-vpn at all; the pin is untested, not proven"
      printf '%s\n' "$policy"
      exit 1
    }
    # Version lines sit under "Version table:" at a shallower indent than the
    # origin lines beneath them, and carry the priority as their last field.
    usable="$(printf '%s\n' "$policy" | awk '
      /Version table:/ { v = 1; next }
      v && /^        / { next }
      v && NF && $NF !~ /^-/ { print $NF }')"
    [ -z "$usable" ] || {
      echo "mullvad-vpn is offered at non-negative priority: ${usable}"
      exit 1
    }
    ! apt-get -s install mullvad-vpn >/dev/null 2>&1 || {
      echo "apt-get would install mullvad-vpn despite the pin"
      exit 1
    }
  args:
    executable: /bin/bash
  changed_when: false
