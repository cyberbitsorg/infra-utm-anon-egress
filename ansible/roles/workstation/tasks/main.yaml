---
# The console kernel and console security posture here, then the desktop and
# Mullvad Browser in desktop.yaml, then the Kali toolset in tools.yaml.
#
# EVERYTHING that touches the network must stay behind workstation_has_egress:
# this host reaches a mirror ONLY because the gateway forwards it into the
# tunnel, so a task that assumes apt works would hang rather than fail.
- name: Mark workstation provisioned
  ansible.builtin.copy:
    dest: /etc/anon-egress-role
    content: "workstation\n"
    owner: root
    group: root
    mode: "0644"

# --- UTM console (needs egress, so it waited for the tunnel) -----------------
# Kali publishes only the "genericcloud" image, whose kernel is built with no
# DRM drivers: nothing binds to UTM's virtio-gpu device and the display stays
# dead forever. The gateway dodges this with Debian's "generic" image; Kali has
# no such variant, so the only fix is to install the standard kernel and boot
# it. It is also the prerequisite for a desktop: a greeter needs a framebuffer.
- name: Fail clearly if the console kernel is enabled without egress
  ansible.builtin.fail:
    msg: >-
      workstation_console_kernel is enabled but this host cannot reach a package
      mirror. It has no NAT NIC by design; the gateway must forward its traffic
      first (Phase 2: VPN + kill-switch). Turn this back off, or finish Phase 2.
  when:
    - workstation_console_kernel | default(false) | bool
    - not workstation_has_egress | default(false) | bool

- name: Install the standard Kali kernel (includes virtio_gpu for the console)
  ansible.builtin.apt:
    name: linux-image-arm64
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - workstation_console_kernel | default(false) | bool
    - workstation_has_egress | default(false) | bool
    - ansible_distribution == 'Kali'
  notify: Reboot into the standard kernel

- name: Make grub default to the standard (non-cloud) kernel
  # Read the real menuentry ids out of grub.cfg rather than guessing a version,
  # and pin with GRUB_DEFAULT=saved: grub sorts the "cloud" flavour ahead of
  # the plain one at the same version, so without this the driver-less kernel
  # keeps winning. The cloud kernel STAYS installed as a fallback -- purging it
  # wedges the boot.
  ansible.builtin.shell: |
    set -euo pipefail
    update-grub
    sub="$(awk -F"'" '/^submenu / {print $4; exit}' /boot/grub/grub.cfg)"
    entry="$(awk -F"'" '/[[:space:]]menuentry / && /gnulinux/ && /kali-arm64/ && !/cloud/ && !/recovery/ {print $4; exit}' /boot/grub/grub.cfg)"
    [ -n "$entry" ] || { echo "no standard-kernel grub entry found"; exit 1; }
    if ! grep -q '^GRUB_DEFAULT=saved' /etc/default/grub; then
      sed -i 's/^GRUB_DEFAULT=.*/GRUB_DEFAULT=saved/' /etc/default/grub
      grep -q '^GRUB_DEFAULT=' /etc/default/grub || echo 'GRUB_DEFAULT=saved' >> /etc/default/grub
    fi
    update-grub
    if [ -n "$sub" ]; then grub-set-default "${sub}>${entry}"; else grub-set-default "${entry}"; fi
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - workstation_console_kernel | default(false) | bool
    - workstation_has_egress | default(false) | bool
    - ansible_distribution == 'Kali'

- name: Remove the Kali image's console auto-login overrides
  # The image ships agetty drop-ins that auto-login root on tty1 and the serial
  # console. An unauthenticated root console is not acceptable here. They are
  # owned by no package, so removal is permanent. Needs no egress.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/getty@tty1.service.d/autologin.conf
    - /etc/systemd/system/serial-getty@.service.d/autologin.conf
  notify: Reload systemd and restart the tty1 getty

- name: Set the workstation's console password
  # cloud-init locks the account, so without this the console is diagnostic
  # only and a desktop greeter would be unusable. chpasswd on the guest also
  # unlocks it. Console/GUI only -- SSH stays key-only.
  ansible.builtin.shell:
    # pipefail under bash: without it a failing `echo` is masked by chpasswd's
    # exit status and the task reports success over an unset password.
    cmd: "set -o pipefail; echo '{{ ansible_user }}:{{ workstation_console_password }}' | chpasswd"
    executable: /bin/bash
  changed_when: false
  no_log: true
  when: (workstation_console_password | default('')) | length > 0

- name: Apply the pending kernel reboot before the desktop
  # Handlers are PLAY-scoped, so without this they would run after the desktop
  # include. But the desktop's precondition is the RUNNING kernel: on a cold
  # build lightdm would start with no framebuffer, respawn until it burned
  # systemd's start limit, and be left failed. No `when:` is possible on a meta
  # task and none is needed: with no handler queued this costs nothing.
  ansible.builtin.meta: flush_handlers

# MUST come after the console-kernel block AND the flush: an XFCE greeter has
# nothing to draw on under the driver-less cloud kernel.
- name: Configure the desktop
  ansible.builtin.include_tasks: desktop.yaml
  when: workstation_desktop | default(false) | bool
  tags: [desktop]

# MUST come after the desktop include: tool groups can pull GUI applications,
# and the desktop's NetworkManager neutralisation must be in place before
# several hundred more packages arrive.
- name: Install the Kali toolset
  ansible.builtin.include_tasks: tools.yaml
  tags: [tools]
