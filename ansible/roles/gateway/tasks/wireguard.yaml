---
# The NIC discovery lives in nic-facts.yaml: the rotation play reuses it, since
# it deploys a ruleset too and must never name interfaces differently.
- name: Identify the NICs
  ansible.builtin.include_tasks: nic-facts.yaml

- name: Install WireGuard
  # wireguard-tools only: no vendor daemon. Mullvad's app is amd64-only and
  # would manage its own routes and firewall rules against ours.
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
    update_cache: true
    cache_valid_time: 3600

# The config deploy lives in wg-conf-deploy.yaml: the rotation play reuses it
# so there is exactly one definition of what /etc/wireguard/wg0.conf contains.
- name: Deploy the WireGuard config
  ansible.builtin.include_tasks: wg-conf-deploy.yaml
