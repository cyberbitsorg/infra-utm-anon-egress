---
# The gateway is the whole anonymity layer, and the include order below is
# load-bearing: wireguard.yaml derives the interface facts the ruleset
# consumes, nftables.yaml closes the box, dns.yaml then bridges DNS through the
# tunnel it just became the only path for.
- name: Mark gateway provisioned
  ansible.builtin.copy:
    dest: /etc/anon-egress-role
    content: "gateway\n"
    owner: root
    group: root
    mode: "0644"

- name: Install tcpdump on the gateway
  # scripts/verify.sh proves the kill-switch by watching the WAN NIC itself.
  # Without tcpdump that check quietly degrades to "not tested", which is the
  # most dangerous kind of green. Installed early and ungated, while apt still
  # has the cloud-init bootstrap resolver. Gateway only.
  ansible.builtin.apt:
    name: tcpdump
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Keep persistent IPv4 forwarding OFF (nftables switches it on)
  # Forwarding is granted by nftables.service's ExecStartPost once the ruleset
  # has actually loaded, and withdrawn by ExecStopPost. A failed nftables plus
  # a forwarding kernel is the one state that leaks everything, so the absence
  # of rules must also mean the absence of forwarding. sysctl_set/reload are
  # false: this writes the boot default only, never the live value.
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "0"
    sysctl_file: /etc/sysctl.d/99-gateway-forward.conf
    sysctl_set: false
    state: present
    reload: false

- name: Set the gateway's console password
  # cloud-init locks the account; chpasswd on the guest unlocks it without
  # needing crypt/passlib on the control node. Console/GUI only -- SSH stays
  # key-only. Unset means "leave it locked".
  ansible.builtin.shell:
    # pipefail under bash: without it a failing `echo` is masked by chpasswd's
    # exit status and the task reports success over an unset password.
    cmd: "set -o pipefail; echo '{{ ansible_user }}:{{ gateway_console_password }}' | chpasswd"
    executable: /bin/bash
  changed_when: false
  no_log: true
  when: (gateway_console_password | default('')) | length > 0

# Everything below needs a tunnel. With no sanitised config the gateway stays
# as Phase 1 left it and the workstation keeps zero egress -- a safe state.
# Gated on mullvad_wg_sanitized, the sanitised copy scripts/up.sh stages.
- name: Configure the anonymity layer
  ansible.builtin.include_tasks: wireguard.yaml
  when: mullvad_wg_sanitized | default('') | length > 0
  tags: [vpn, wireguard]

# MUST come after the wireguard include: the ruleset template consumes the
# anon_wan_if / anon_internal_if facts set there.
- name: Configure the kill-switch
  ansible.builtin.include_tasks: nftables.yaml
  when: mullvad_wg_sanitized | default('') | length > 0
  tags: [vpn, nftables, killswitch]

# MUST come after the nftables include: `apt install unbound` needs DNS, and
# the only resolver that survives the ruleset is the in-tunnel bridge that
# include writes. unbound's answers also reach the workstation only because
# the input chain accepts :53 on the internal NIC.
- name: Configure tunnel-only DNS
  ansible.builtin.include_tasks: dns.yaml
  when: mullvad_wg_sanitized | default('') | length > 0
  tags: [vpn, dns]
