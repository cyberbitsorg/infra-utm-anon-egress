---
# Phase 1 stub. The real content -- VPN client (Nym default, Mullvad fallback),
# the fail-closed nftables kill-switch, a tunnel-bound resolver and IPv6 drop --
# lands in Phase 2. See docs/superpowers/plans/.
#
# The marker file exists so 'make up' proves Ansible actually reached this host.
- name: Mark gateway provisioned (Phase 1)
  ansible.builtin.copy:
    dest: /etc/anon-egress-role
    content: "gateway\n"
    owner: root
    group: root
    mode: "0644"

- name: Confirm IPv4 forwarding is enabled (set by cloud-init)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-gateway-forward.conf
    sysctl_set: true
    state: present
    reload: true

- name: Set the gateway's console password
  # cloud-init locks the user's password, so without this the UTM console can
  # show boot output but not accept a login. Set on the guest so we do not depend
  # on the control node's crypt/passlib; chpasswd also unlocks the account.
  # Console/GUI only -- SSH stays key-only (ssh_pwauth: false).
  #
  # Comes from GATEWAY_CONSOLE_PASSWORD in .env via a 0600 vars file (see
  # render_secret_vars in scripts/lib.sh). Unset means "leave it locked", which is
  # why the group_vars default is an empty string rather than a value.
  ansible.builtin.shell:
    cmd: "echo '{{ ansible_user }}:{{ gateway_console_password }}' | chpasswd"
  changed_when: false
  no_log: true
  when: (gateway_console_password | default('')) | length > 0
