---
# Phase 1 stub. The real content -- VPN client (Nym default, Mullvad fallback),
# the fail-closed nftables kill-switch, a tunnel-bound resolver and IPv6 drop --
# lands in Phase 2. See docs/superpowers/plans/.
#
# The marker file exists so 'make up' proves Ansible actually reached this host.
- name: Mark gateway provisioned (Phase 1)
  ansible.builtin.copy:
    dest: /etc/anon-egress-role
    content: "gateway\n"
    owner: root
    group: root
    mode: "0644"

- name: Keep persistent IPv4 forwarding OFF (nftables switches it on)
  # Deliberately 0, and deliberately not applied here. Forwarding is granted by
  # nftables.service's ExecStartPost once the kill-switch ruleset has actually
  # loaded, and withdrawn by its ExecStopPost. If this file asserted 1, a failed
  # nftables.service would leave the kernel with no ruleset at all -- default
  # accept -- while still forwarding the workstation's traffic straight out the
  # WAN in the clear. The absence of rules is the danger, so the absence of rules
  # must also mean the absence of forwarding.
  #
  # sysctl_set/reload are false so this only writes the boot default; the live
  # value belongs to nftables.service and must not be stomped mid-run.
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "0"
    sysctl_file: /etc/sysctl.d/99-gateway-forward.conf
    sysctl_set: false
    state: present
    reload: false

- name: Set the gateway's console password
  # cloud-init locks the user's password, so without this the UTM console can
  # show boot output but not accept a login. Set on the guest so we do not depend
  # on the control node's crypt/passlib; chpasswd also unlocks the account.
  # Console/GUI only -- SSH stays key-only (ssh_pwauth: false).
  #
  # Comes from GATEWAY_CONSOLE_PASSWORD in .env via a 0600 vars file (see
  # render_secret_vars in scripts/lib.sh). Unset means "leave it locked", which is
  # why the group_vars default is an empty string rather than a value.
  ansible.builtin.shell:
    cmd: "echo '{{ ansible_user }}:{{ gateway_console_password }}' | chpasswd"
  changed_when: false
  no_log: true
  when: (gateway_console_password | default('')) | length > 0

# Everything below needs a tunnel. With no sanitised config the gateway stays
# exactly as Phase 1 left it and the workstation keeps zero egress -- a safe
# state. Gated on mullvad_wg_sanitized (the file the role actually reads), not
# mullvad_wg_config (the operator's original path, which no task here touches).
- name: Configure the anonymity layer
  ansible.builtin.include_tasks: wireguard.yaml
  when: mullvad_wg_sanitized | default('') | length > 0
  tags: [vpn, wireguard]

# MUST come after the wireguard include: the ruleset template consumes the
# anon_wan_if / anon_internal_if facts set there. Gated on the same condition --
# a kill-switch whose only permitted egress is an endpoint that was never
# configured would close the gateway with no way back out.
- name: Configure the kill-switch
  ansible.builtin.include_tasks: nftables.yaml
  when: mullvad_wg_sanitized | default('') | length > 0
  tags: [vpn, nftables, killswitch]

# MUST come after the nftables include, for two reasons. `apt install unbound`
# needs DNS, and the only resolver that survives the ruleset is the in-tunnel
# bridge that include writes. And unbound's answers reach the workstation only
# because the input chain accepts :53 on the internal NIC. Same gate as above: a
# resolver that can only forward through a tunnel is useless without one, and
# pointing the gateway's resolv.conf at it would break DNS outright.
- name: Configure tunnel-only DNS
  ansible.builtin.include_tasks: dns.yaml
  when: mullvad_wg_sanitized | default('') | length > 0
  tags: [vpn, dns]
