---
- name: Stop cloud-init from rewriting resolv.conf
  # Must come before anything here writes resolv.conf. A regenerated file pointing
  # back at SLIRP's 10.0.2.3 would not leak (the ruleset drops :53 on the WAN) but
  # it would silently break all gateway DNS on the next boot.
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-anon-egress-no-resolv.cfg
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role: gateway).
      manage_resolv_conf: false

- name: Check whether unbound is already this gateway's resolver
  ansible.builtin.stat:
    path: /etc/unbound/unbound.conf.d/anon-egress.conf
  register: anon_unbound_conf

- name: Bridge DNS through the tunnel until unbound exists
  # FIRST RUN ONLY. The nftables ruleset has just cut off SLIRP's 10.0.2.3, and
  # the next task has to `apt install unbound` -- which needs to resolve a mirror.
  # Mullvad's resolver is reachable inside the tunnel and permitted by
  # `oifname wg0 accept`, so it bridges the gap without ever leaking a query.
  #
  # Guarded on our unbound fragment already existing, because without the guard
  # this task and "Point the gateway's own resolver at unbound" below overwrite
  # each other on every single run: both report changed forever and the role never
  # converges. Once unbound is configured the bridge has done its job and must not
  # run again.
  #
  # `follow: false` (the module default, stated because it is load-bearing)
  # REPLACES the symlink the Debian cloud image ships at /etc/resolv.conf ->
  # /run/systemd/resolve/resolv.conf with a real file. Were it true, this would
  # write into systemd-resolved's runtime file, which resolved rewrites and a
  # reboot discards. systemd's tmpfiles entry for that symlink is `L!`
  # (create-if-absent, boot-only), so it does not put the symlink back over a
  # regular file.
  #
  # With the tunnel down this leaves the gateway with no DNS at all. That is the
  # fail-closed promise applied consistently, not a defect.
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    follow: false
    content: |
      # Managed by Ansible (role: gateway).
      # Bootstrap only: Mullvad's resolver, reachable inside the tunnel. Replaced
      # by unbound on loopback at the end of this task list.
      nameserver {{ mullvad_dns }}
      options timeout:2 attempts:2
  when: not anon_unbound_conf.stat.exists

- name: Install unbound
  # Needs working DNS to resolve the mirror -- either the bridge above on a first
  # run, or unbound itself on every run after that.
  ansible.builtin.apt:
    name: unbound
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy the unbound configuration
  ansible.builtin.template:
    src: unbound-anon.conf.j2
    dest: /etc/unbound/unbound.conf.d/anon-egress.conf
    owner: root
    group: root
    mode: "0644"
    # Same reasoning as the nftables ruleset: never install a config the daemon
    # cannot parse. unbound would keep serving the old one until a restart and
    # then fail to come back, leaving the workstation with no resolver.
    validate: "/usr/sbin/unbound-checkconf %s"
  notify: Restart unbound

- name: Enable unbound
  ansible.builtin.systemd_service:
    name: unbound
    enabled: true
    state: started

- name: Point the gateway's own resolver at unbound
  # Supersedes the bridge above. From here the gateway resolves via unbound on
  # loopback, which forwards through the tunnel -- one resolver for both the
  # gateway and the workstation, and one place where DNS policy lives.
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    follow: false
    content: |
      # Managed by Ansible (role: gateway).
      # unbound on loopback; it forwards to Mullvad's resolver inside the tunnel.
      nameserver 127.0.0.1
      options timeout:2 attempts:2
