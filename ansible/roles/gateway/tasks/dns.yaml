---
- name: Stop cloud-init from rewriting resolv.conf
  # A regenerated file pointing back at SLIRP's 10.0.2.3 would not leak (the
  # ruleset drops :53 on the WAN) but it would break gateway DNS on the next
  # boot. Must come before anything here writes resolv.conf.
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-anon-egress-no-resolv.cfg
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role: gateway).
      manage_resolv_conf: false

- name: Check whether unbound is already this gateway's resolver
  ansible.builtin.stat:
    path: /etc/unbound/unbound.conf.d/anon-egress.conf
  register: anon_unbound_conf

- name: Bridge DNS through the tunnel until unbound exists
  # FIRST RUN ONLY. The ruleset has just cut off SLIRP's 10.0.2.3 and the next
  # task must resolve a mirror to install unbound. Mullvad's resolver is
  # reachable inside the tunnel, so this bridges the gap without leaking a
  # query. Guarded on our unbound fragment existing: without the guard this and
  # the last task in this file overwrite each other every run and the role
  # never converges.
  #
  # `follow: false` (the module default, stated because it is load-bearing)
  # REPLACES the image's symlink to systemd-resolved's runtime file with a real
  # file; writing through the symlink would be discarded on reboot.
  #
  # With the tunnel down this leaves the gateway with no DNS at all: the
  # fail-closed promise applied consistently, not a defect.
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    follow: false
    content: |
      # Managed by Ansible (role: gateway).
      # Bootstrap only: Mullvad's resolver, reachable inside the tunnel.
      # Replaced by unbound on loopback at the end of this task list.
      nameserver {{ mullvad_dns }}
      options timeout:2 attempts:2
  when: not anon_unbound_conf.stat.exists

- name: Install unbound
  ansible.builtin.apt:
    name: unbound
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy the unbound configuration
  ansible.builtin.template:
    src: unbound-anon.conf.j2
    dest: /etc/unbound/unbound.conf.d/anon-egress.conf
    owner: root
    group: root
    mode: "0644"
    # Never install a config the daemon cannot parse: unbound would serve the
    # old one until a restart, then fail to come back at all.
    validate: "/usr/sbin/unbound-checkconf %s"
  notify: Restart unbound

- name: Enable unbound
  ansible.builtin.systemd_service:
    name: unbound
    enabled: true
    state: started

- name: Point the gateway's own resolver at unbound
  # Supersedes the bridge above: one resolver for both the gateway and the
  # workstation, and one place where DNS policy lives.
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    follow: false
    content: |
      # Managed by Ansible (role: gateway).
      # unbound on loopback; it forwards to Mullvad's resolver inside the tunnel.
      nameserver 127.0.0.1
      options timeout:2 attempts:2
