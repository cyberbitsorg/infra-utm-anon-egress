---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy the kill-switch ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    # Never install a ruleset nft cannot parse: that leaves either stale rules
    # or, after a reboot, no rules at all.
    validate: "/usr/sbin/nft -c -f %s"
  notify: Reload nftables

- name: Ensure the nftables drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Enable IPv4 forwarding only once the ruleset is loaded
  # ExecStartPost runs only if the unit started, so a ruleset that fails to
  # load leaves forwarding off and the workstation with no path at all.
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/10-enable-forwarding.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role: gateway).
      [Service]
      ExecStartPost=/sbin/sysctl -w net.ipv4.ip_forward=1
      ExecStopPost=/sbin/sysctl -w net.ipv4.ip_forward=0
  notify: Restart nftables

- name: Enable nftables at boot
  # `state: started` also LOADS the ruleset on the first run, before the
  # handler would: from here on the gateway is closed. Nothing between this and
  # dns.yaml needs DNS or clear-net, so the gap is inert.
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Ensure the WireGuard unit drop-in directory exists
  ansible.builtin.file:
    path: "/etc/systemd/system/wg-quick@{{ wg_interface }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Order WireGuard after nftables
  # THE fail-closed mechanism: without After=, systemd may start wg-quick
  # first and a boot could route before the ruleset exists.
  #
  # Requires=, not Wants=: Wants is advisory, so a failed nftables.service
  # would let wg-quick bring the tunnel up with no ruleset behind it.
  #
  # PartOf= because Debian's nftables.service runs `nft flush ruleset` on stop,
  # which destroys wg-quick's own packet-marking table. Without it,
  # `systemctl stop nftables` leaves wg-quick "running" with no handshake and
  # nothing that says why.
  #
  # This narrows the failure rather than eliminating it: with nftables failed
  # there is no ruleset at all and the kernel default is accept. What prevents
  # that is `validate:` on the template above, which stops an unparseable
  # /etc/nftables.conf from landing in the first place.
  ansible.builtin.copy:
    dest: "/etc/systemd/system/wg-quick@{{ wg_interface }}.service.d/10-after-nftables.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role: gateway).
      [Unit]
      After=nftables.service
      Requires=nftables.service
      PartOf=nftables.service
  notify: Restart WireGuard

- name: Enable WireGuard at boot
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wg_interface }}"
    enabled: true
    state: started
    daemon_reload: true

# Loading the ruleset above kills the gateway's own resolver (it drops :53 on
# the WAN, and until now DNS came from SLIRP's 10.0.2.3). Nothing between here
# and dns.yaml needs to resolve a name. dns.yaml owns every resolv.conf
# decision -- when this file also wrote it, the two fought and every run
# reported both changed.
