---
- name: Restart WireGuard
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wg_interface }}"
    state: restarted
    enabled: true
    daemon_reload: true

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
    enabled: true

- name: Restart unbound
  ansible.builtin.systemd_service:
    name: unbound
    state: restarted
    enabled: true
