---
- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy MOTD
  ansible.builtin.copy:
    dest: /etc/motd
    mode: "0644"
    content: |+

      ════════════════════════════════════════
        anon-egress · {{ inventory_hostname }} · {{ internal_ip | default('n/a') }}
        Authorised use only.
      ════════════════════════════════════════


