---
- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Update the apt cache
  # Its own task, and deliberately WITHOUT cache_valid_time: a FAILED update
  # still refreshes the timestamp, so for the next hour every retry would skip
  # the update and the install would report "No package matching 'curl'" with
  # no hint that the real cause is an unreachable mirror. The retries matter
  # because this runs moments after the tunnel came up.
  ansible.builtin.apt:
    update_cache: true
  register: anon_apt_update
  retries: 3
  delay: 10
  until: anon_apt_update is succeeded
  when: common_packages | length > 0

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  # An internal-only host with no tunnel yet sets common_packages to []; the
  # skip keeps that a configuration choice rather than an apt timeout.
  when: common_packages | length > 0

- name: Deploy MOTD
  ansible.builtin.copy:
    dest: /etc/motd
    mode: "0644"
    content: |+

      ════════════════════════════════════════
        anon-egress · {{ inventory_hostname }} · {{ internal_ip | default('n/a') }}
        Authorised use only.
      ════════════════════════════════════════


