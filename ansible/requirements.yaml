  - name: community.general
    version: ">=13.0.0,<14.0.0"
  # ansible.posix: sysctl now, and the natural home for Phase 2's firewall and
  # mount work on the gateway.
  - name: ansible.posix
    version: ">=2.0.0,<3.0.0"
