---
# Console/GUI password for the gateway user. Empty = leave the account locked
# as cloud-init created it. The real value comes from GATEWAY_CONSOLE_PASSWORD
# in .env via a 0600 vars file -- never put one here: this file is tracked.
# SSH is key-only regardless.
gateway_console_password: ""

# Path on the CONTROL NODE to the operator's original WireGuard config. No task
# reads it directly; it only keeps the vars-file key defined. The role consumes
# the sanitised copy below.
mullvad_wg_config: ""

# Path on the CONTROL NODE to the sanitised WireGuard config (DNS line and IPv6
# stripped), injected by scripts/up.sh. Empty means "no tunnel": every Phase 2
# task is skipped and the workstation keeps zero egress -- a safe state.
mullvad_wg_sanitized: ""
mullvad_endpoint_ip: ""
mullvad_endpoint_port: ""

# WireGuard interface name, hardcoded so the nftables ruleset can reference it.
wg_interface: wg0

# Tunnel MTU. 1280 measured good over QEMU's SLIRP NAT; too large silently
# stalls large transfers while ping still works, so ping is NOT a test of this.
# If HTTPS stalls, lower it (1280 -> 1240 -> 1200) and `make configure`.
wg_mtu: 1280

# Mullvad's resolver, reachable only inside the tunnel.
mullvad_dns: "10.64.0.1"
