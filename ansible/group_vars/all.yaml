---
# UTC on purpose: a guest timezone is application-level fingerprint surface on
# an anonymity workstation, and neutral for everyone else.
timezone: UTC

# The isolated internal segment, mirrored from lab.conf's LAB_SEGMENT for the
# templates that need it (unbound's access-control). Kept in sync by hand: it is
# build configuration, not a per-host fact, and changing the segment already means
# editing lab.conf and rebuilding.
lab_segment: "10.20.0.0/24"

# Packages installed on every host.
common_packages:
  - ca-certificates
  - curl
  - dnsutils
  - git
  - htop
  - jq
  - net-tools
  - tmux
  - tree
  - vim
