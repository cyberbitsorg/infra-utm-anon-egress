---
# The workstation is internal-only: it has exactly one NIC, on a host-only switch
# with no gateway of its own. Everything below therefore reaches the internet only
# because the gateway forwards it into the WireGuard tunnel -- every package here
# is downloaded over the VPN, never over the real IP. That ordering is the reason
# these lists stayed empty until Phase 2 worked.
#
# Phase 3's desktop, Mullvad Browser and Kali toolset sit on top of this base
# (see workstation_desktop and workstation_tools_groups below).
common_packages:
  - ca-certificates
  - curl
  - dnsutils
  - git
  - htop
  - jq
  - net-tools
  - tmux
  - tree
  - vim

# --- Egress-dependent features ----------------------------------------------
# Both were off through Phase 1, when this host had no route off the internal
# segment at all. Phase 2's gateway now forwards it through the VPN tunnel, so
# they are on -- and Kali's kernel is downloaded through the tunnel rather than
# over the real IP, which is the whole point of doing it in this order.
#
# workstation_has_egress is the honest statement of fact ("the gateway forwards
# this host's traffic now"); workstation_console_kernel is the feature that needs
# it. They stay separate so that enabling the feature without the fact fails with
# a clear message instead of an apt timeout. If the tunnel is ever removed, set
# workstation_has_egress back to false FIRST.
workstation_has_egress: true
workstation_console_kernel: true

# Install the Kali XFCE desktop and Mullvad Browser. Needs workstation_has_egress
# for the same reason the console kernel does -- 951 packages and a browser have
# to come from somewhere, and this host's only route is the gateway's tunnel.
#
# It ALSO needs workstation_console_password to be set. cloud-init locks the
# account, so a graphical greeter with no password is a login prompt that cannot
# be passed. The role fails early and says so rather than leaving you staring at
# an unusable greeter.
workstation_desktop: true

# Console/GUI password for the workstation user. Empty = leave the account locked
# as cloud-init created it, so the console is diagnostic only (you can read boot
# and cloud-init output, but not log in). A desktop greeter needs this set.
#
# Do NOT put a real value here: this file is tracked in git. The value comes from
# WORKSTATION_CONSOLE_PASSWORD in .env (gitignored, mode 0600), handed to Ansible
# through a 0600 vars file by scripts/up.sh. `make preflight` generates one.
#
# This is the workstation's only recovery path: it has no host port forward, so if
# the gateway or its own sshd fails, the UTM console is the way in.
# SSH is key-only regardless of this setting.
workstation_console_password: ""

# --- Kali toolset ------------------------------------------------------------
# Which Kali function groups to install, WITHOUT the kali-tools- prefix. The
# real value comes from KALI_TOOL_GROUPS in lab.conf, handed to Ansible through
# the 0600 vars file by scripts/up.sh; an empty selection omits the variable
# entirely, so this default is what decides that "no selection" means "no
# tooling". Never put a build's selection here: this file is tracked.
workstation_tools_groups: []

# Every package that must never be installed on this host, because each one is a
# VPN client (or the library half of one) and this host must hold no VPN
# credentials at all.
#
# TWO consumers, deliberately not merged. desktop.yaml and tools.yaml PURGE
# this list; scripts/verify.sh keeps its own copy and independently ASSERTS the
# same set stayed absent. An assertion reading the same variable the removal
# used would pass by construction. tests/vpn-watch-list.sh pins the two copies
# to each other so they cannot drift apart unnoticed.
#
# Measured 2026-07-30: the kali-linux-headless/-default/-large/-everything
# umbrellas pull openvpn, vpnc and vpnc-scripts (-everything adds
# wireguard-tools). No kali-tools-* group pulls any of them, which is why the
# toolset is built from those groups and the umbrellas are unselectable.
workstation_vpn_watch_list:
  # Mullvad's own client, which their repository carries for arm64. An apt pin
  # blocks it; this catches it arriving any other way.
  - mullvad-vpn
  # The NetworkManager VPN plugins the desktop recommends.
  - network-manager-openvpn
  - network-manager-openvpn-gnome
  - network-manager-pptp
  - network-manager-pptp-gnome
  - network-manager-l2tp
  - network-manager-l2tp-gnome
  - network-manager-openconnect
  - network-manager-openconnect-gnome
  - network-manager-vpnc
  - network-manager-vpnc-gnome
  - network-manager-fortisslvpn
  - network-manager-fortisslvpn-gnome
  # The clients those plugins drove, which outlive them. This guest was measured
  # carrying working openvpn, openconnect, vpnc, pptp and strongswan binaries
  # with every plugin already gone.
  - openvpn
  - openconnect
  - vpnc
  - vpnc-scripts
  - pptp-linux
  - wireguard
  - wireguard-tools
  # strongswan, named both as it is actually installed (the daemon packages) and
  # as the metapackage, which is not installed today but would be on an image
  # that pulls it. The two libstrongswan packages go too, not because a library
  # can dial a tunnel, but because leaving them is the same orphaning mistake
  # that left openvpn behind.
  - strongswan
  - strongswan-starter
  - strongswan-charon
  - strongswan-libcharon
  - libcharon-extauth-plugins
  - libstrongswan
  - libstrongswan-standard-plugins
