---
# The workstation is internal-only: everything below reaches the internet only
# because the gateway forwards it into the tunnel, so every package here is
# downloaded over the VPN, never over the real IP.
common_packages:
  - ca-certificates
  - curl
  - dnsutils
  - git
  - htop
  - jq
  - net-tools
  - tmux
  - tree
  - vim

# --- Egress-dependent features ----------------------------------------------
# workstation_has_egress states the fact ("the gateway forwards this host");
# workstation_console_kernel is the feature that needs it. Separate, so
# enabling the feature without the fact fails with a clear message instead of
# an apt timeout. If the tunnel is ever removed, set has_egress false FIRST.
workstation_has_egress: true
workstation_console_kernel: true

# Install the Kali XFCE desktop and Mullvad Browser. Needs egress, and needs
# workstation_console_password set: cloud-init locks the account, so a greeter
# with no password is a login prompt that cannot be passed.
workstation_desktop: true

# Host<->guest clipboard via the SPICE agent (needs workstation_desktop). OFF:
# it bridges the anonymity workstation to the clipboard of an untrusted host.
workstation_clipboard: false

# Console/GUI password for the workstation user. Empty = the console is
# diagnostic only. The real value comes from WORKSTATION_CONSOLE_PASSWORD in
# .env via a 0600 vars file -- never put one here: this file is tracked. This
# is the workstation's only way in besides the gateway. SSH stays key-only.
workstation_console_password: ""

# --- Kali toolset ------------------------------------------------------------
# Kali function groups WITHOUT the kali-tools- prefix. The real value comes
# from KALI_TOOL_GROUPS in lab.conf via the 0600 vars file; an empty selection
# omits the variable, so this default decides that "no selection" = no tooling.
workstation_tools_groups: []

# Every package that must never be installed on this host: each is a VPN client
# (or the library half of one), and this host must hold no VPN credentials.
#
# TWO consumers, deliberately not merged: this role PURGES the list, and
# scripts/verify.sh keeps its own copy and independently ASSERTS the same set
# stayed absent (an assertion reading the variable the removal used would pass
# by construction). tests/vpn-watch-list.sh pins the two copies to each other.
workstation_vpn_watch_list:
  # Mullvad's own client, which their repository carries for arm64. An apt pin
  # blocks it; this catches it arriving any other way.
  - mullvad-vpn
  # The NetworkManager VPN plugins the desktop recommends.
  - network-manager-openvpn
  - network-manager-openvpn-gnome
  - network-manager-pptp
  - network-manager-pptp-gnome
  - network-manager-l2tp
  - network-manager-l2tp-gnome
  - network-manager-openconnect
  - network-manager-openconnect-gnome
  - network-manager-vpnc
  - network-manager-vpnc-gnome
  - network-manager-fortisslvpn
  - network-manager-fortisslvpn-gnome
  # The clients those plugins drove, which outlive them.
  - openvpn
  - openconnect
  - vpnc
  - vpnc-scripts
  - pptp-linux
  - wireguard
  - wireguard-tools
  # strongswan as it is actually installed (the daemon packages) and as the
  # metapackage an image might pull.
  - strongswan
  - strongswan-starter
  - strongswan-charon
  - strongswan-libcharon
  - libcharon-extauth-plugins
  - libstrongswan
  - libstrongswan-standard-plugins
