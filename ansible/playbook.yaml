---
# Configures the two VMs after provisioning. Idempotent: safe to re-run.
# Run subsets with tags, e.g. --tags gateway or --tags workstation.
#
# ORDER MATTERS three times over: the workstation is reached through the
# gateway (reachability); it has no route to a mirror until the gateway play
# brings up the tunnel (egress); and on an ALREADY-BUILT gateway, rotated
# tunnel credentials must be applied before anything needs egress (the
# rotation play below). That is why the base play is SPLIT: `common` runs on
# the gateway before the gateway play, and on the internal-only hosts after it.

- name: Wait for first boot on all hosts
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # sshd answers long before cloud-init finishes; without this wait,
    # cloud-init's own apt update races the common role's apt tasks.
    - name: Wait for cloud-init to finish first boot
      ansible.builtin.command: cloud-init status --wait
      register: anon_cloud_init
      changed_when: false
      # 0 = done; 2 = done with a recoverable error, surfaced below.
      failed_when: anon_cloud_init.rc not in [0, 2]

    - name: Report a degraded cloud-init
      ansible.builtin.debug:
        msg: >-
          cloud-init finished with recoverable errors on {{ inventory_hostname }}.
          Check /var/log/cloud-init.log -- something in the seed did not apply.
      when: anon_cloud_init.rc == 2

- name: Rotate the tunnel on an already-built gateway
  # Credential rotation (new Mullvad account, new exit country) must take
  # effect BEFORE any task that needs egress -- and on a built gateway that is
  # everything, apt first among them, because the kill-switch fail-closes all
  # of it through the OLD tunnel. Without this play, `make up` after a rotation
  # wedges at "Update the apt cache" forever: the new config sits in the
  # gateway role that apt can never reach.
  #
  # Fresh gateways skip it (/etc/wireguard/wg0.conf does not exist yet), so the
  # provisioning ordering below -- apt while the kill-switch is still down --
  # is untouched. Fail-closed both ways: a BAD rotation still hangs at apt
  # rather than leaking, by design.
  hosts: role_gateway
  become: true
  gather_facts: true
  tags: [gateway, vpn]
  # Run through the gateway role (import_role + tasks_from: rotation) rather
  # than including its task files here directly: the snippets notify the
  # role's HANDLERS, which are only in scope inside the role. (import_role,
  # not a play-level roles entry: that form silently ignores tasks_from and
  # runs the role's main.yaml instead.)
  tasks:
    - name: Run the gateway role's rotation entry point
      ansible.builtin.import_role:
        name: gateway
        tasks_from: rotation

- name: Base configuration for the gateway
  # On a FRESH gateway (rotation play skipped): before the gateway role, the
  # kill-switch has not loaded yet, so apt works.
  hosts: role_gateway
  become: true
  roles:
    - role: common
      tags: [common, base]

- name: Configure gateway
  hosts: role_gateway
  become: true
  roles:
    - role: gateway
      tags: [gateway]

- name: Base configuration for the internal-only hosts
  # AFTER the gateway play: these hosts reach a mirror only through the tunnel
  # it just brought up. "Everything that is not the gateway" so a third
  # internal VM inherits the ordering.
  hosts: all:!role_gateway
  become: true
  roles:
    - role: common
      tags: [common, base]

- name: Configure workstation
  hosts: role_workstation
  become: true
  roles:
    - role: workstation
      tags: [workstation]
