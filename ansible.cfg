[defaults]
inventory = ansible/inventory/hosts.generated.yaml
remote_user = anon
private_key_file = ~/.ssh/id_ed25519_anon
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = False
roles_path = ansible/roles

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# ServerAliveInterval is a build-safety net, not a tuning knob.
#
# This playbook reconfigures the network underneath its own connection: it loads
# a policy-drop ruleset on the very host it is talking to. If a rule ever stops
# covering the management path, the gateway's replies are dropped AND so is the
# RST, so the control node is never told the connection died -- ssh blocks
# forever and `make up` hangs with no error and no output. That happened, at the
# "Enable nftables at boot" task, and it cost a 15-minute stall before anyone
# looked.
#
# Keepalives run at the SSH transport layer and are answered even while a long
# remote command (a big apt, a kernel install) is still running, so this does not
# false-trip on slow tasks. It only fires when packets genuinely stop coming
# back. 15s x 8 = a clear failure in about two minutes instead of an indefinite
# hang. The default ssh_args must be repeated here; setting this key replaces
# them rather than adding to them.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=8
