[defaults]
inventory = ansible/inventory/hosts.generated.yaml
# User and key come from the generated inventory (LAB_USER / LAB_SSH_KEY in
# lab.conf), so lab.conf stays the single source of truth for both.
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = False
roles_path = ansible/roles

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# The playbook loads a policy-drop ruleset on the host it is talking to; if a
# rule ever stops covering the management path, ssh hangs forever with no RST.
# Keepalives (answered at the transport layer, so slow apt tasks never trip
# them) turn that into a clear failure in ~2 minutes. Setting ssh_args replaces
# the defaults, so they are repeated here.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=8
