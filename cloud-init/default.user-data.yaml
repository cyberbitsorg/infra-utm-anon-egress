#cloud-config
# Base bootstrap. Placeholders (@@...@@) are filled in by scripts/make-seed.sh;
# role-specific software is Ansible's job, not this file's.
#
# make-seed.sh picks ONE template per role (<role>.user-data.yaml if it exists,
# otherwise this one) and cloud-init does not merge them, so each role template
# is a full copy of this body plus its own changes. Keep the three in sync.

hostname: "@@HOSTNAME@@"
preserve_hostname: false

users:
  - name: "@@LAB_USER@@"
    # no_user_group (--no-user-group) stops useradd creating a group named
    # after the user. Without it, a LAB_USER matching an existing system group
    # (operator, staff, games, users ... all ship on Debian and Kali) fails the
    # whole users_groups module: the user is never created, the key never
    # lands, and every SSH login fails with "Permission denied (publickey)"
    # while the VM otherwise boots fine.
    no_user_group: true
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - "@@SSH_KEY@@"

ssh_pwauth: false
disable_root: true

write_files:
  # Disable periodic apt. Without it, apt-daily-upgrade restarts openssh in the
  # background; a restart can orphan the running sshd, which keeps holding :22
  # and blocks ssh.socket from rebinding, after which every new connection is
  # closed before the banner. Ansible manages packages here anyway.
  - path: /etc/apt/apt.conf.d/99lab-no-periodic
    content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Download-Upgradeable-Packages "0";
      APT::Periodic::Unattended-Upgrade "0";
      APT::Periodic::AutocleanInterval "0";

package_update: true
packages:
  - python3
  - qemu-guest-agent

runcmd:
  - [systemctl, enable, --now, qemu-guest-agent]
  # Pre-create Ansible's remote temp dir (every play runs become: true, so it
  # resolves to /root/.ansible/tmp) to suppress its "did not exist and was
  # created" warning on the first module.
  - [install, -d, -m, "0700", -o, root, -g, root, /root/.ansible/tmp]
  - [sysctl, --system]

# Grow the root filesystem to fill the resized virtual disk.
growpart:
  mode: auto
  devices: ["/"]
resize_rootfs: true
