#cloud-config
# Gateway bootstrap = default.user-data.yaml plus the forwarding sysctl.
# Self-contained because cloud-init does not merge templates; keep the body in
# sync with cloud-init/default.user-data.yaml.
#
# Forwarding is OFF here on purpose. The gateway role's nftables.service
# drop-in is the only thing that turns it on, via ExecStartPost, once the
# kill-switch ruleset has actually loaded -- a failed nftables.service must not
# leave a forwarding kernel with no rules at all.

hostname: "@@HOSTNAME@@"
preserve_hostname: false

users:
  - name: "@@LAB_USER@@"
    # no_user_group (--no-user-group) stops useradd creating a group named
    # after the user. Without it, a LAB_USER matching an existing system group
    # (operator, staff, games, users ...) fails the whole users_groups module:
    # the user is never created, the key never lands, and every SSH login fails
    # with "Permission denied (publickey)" while the VM otherwise boots fine.
    no_user_group: true
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - "@@SSH_KEY@@"

ssh_pwauth: false
disable_root: true

write_files:
  # Disable periodic apt: apt-daily-upgrade restarting openssh can orphan the
  # running sshd, which then holds :22 and blocks ssh.socket from rebinding.
  - path: /etc/apt/apt.conf.d/99lab-no-periodic
    content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Download-Upgradeable-Packages "0";
      APT::Periodic::Unattended-Upgrade "0";
      APT::Periodic::AutocleanInterval "0";

  - path: /etc/sysctl.d/99-gateway-forward.conf
    content: |
      # Forwarding is OFF by default and switched on by nftables.service only
      # after the kill-switch ruleset has actually loaded (see the gateway
      # role). With no ruleset the kernel default is accept, so forwarding must
      # not already be enabled.
      net.ipv4.ip_forward=0

package_update: true
packages:
  - python3
  - qemu-guest-agent

runcmd:
  - [systemctl, enable, --now, qemu-guest-agent]
  # Pre-create Ansible's remote temp dir to suppress its first-module warning.
  - [install, -d, -m, "0700", -o, root, -g, root, /root/.ansible/tmp]
  - [sysctl, --system]

# Grow the root filesystem to fill the resized virtual disk.
growpart:
  mode: auto
  devices: ["/"]
resize_rootfs: true
